# Full多卡训练配置文件
# 包含模型配置、训练参数、并行配置等

# 数据配置
data:
  data_path: "./data/retrosynthesis"
  output_dir: "./logs/retrosynthesis/full_multi_output/qwen2.5-1.5b"
  task_type: "retrosynthesis"  # 正向反应预测: forward, 逆向: retrosynthesis
  max_length: 256
  rxn_max_length: 256
  use_cls_token: True

# 模型配置
model:
  qwen_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  rxn_model_name: "./module/reactionbert"
  proj_dropout: 0.1
  freeze_backbones: true
  freeze_qwen: false
  freeze_reactionbert: false
  use_extended_vocab: true
  extended_vocab_path: "./tokenizer/qwen2.5-1.5b"
  sentinel_token: "<SMI_TOKEN>"
  use_cls_token: True


# 训练配置
training:
  load_checkpoint: "./logs/retrosynthesis/full_multi_output/qwen2.5-1.5b/1.5B_retrosynthesis_bs12_lr5e-6_20251118_191221/final_full_model"  # 指向safetensors权重目录,ord预训练之后的
  resume_training: True                        # 启用断点续训
  ignore_data_skip: True                       # 新数据集时忽略旧步数（从头开始）
  epochs: 5
  batch_size: 12
  gradient_accumulation_steps: 4  # 增加梯度累积步数以保持有效batch_size
  fp16: false
  learning_rate: 2e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1  # warmup步数比例
  weight_decay: 0.015
  evaluation_strategy: "steps"
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 5
  logging_strategy: "steps"
  logging_steps: 10
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 5

# 并行配置
parallel:
  enabled: true
  parallel_mode: "DATA_PARALLEL"
  gradients_mean: true
  parameter_broadcast: true
  worker_num: 8  # 工作进程数
  local_worker_num: 8  # 本地工作进程数
  master_addr: "127.0.0.1"
  master_port: 8118
  log_dir: "./logs/retrosynthesis/full_multi_logs/qwen2.5-1.5b"

# 评估配置
evaluation:
  skip_final_eval: false  # 是否跳过最终评估

# 生成配置
generation:
  max_new_tokens: 256      # 最大生成token数
  do_sample: false        # 是否使用采样
  num_beams: 1

# 随机种子
random_seed: 42

# 设备配置
device:
  device_target: "Ascend"
  # device_id 由并行环境自动分配，无需手动设置