# ===== 模型配置（与溶剂训练保持一致）=====
model:
  qwen_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  rxn_model_name: "./module/reactionbert"
  proj_dropout: 0.3
  freeze_backbones: false
  freeze_qwen: false
  freeze_reactionbert: false
  use_extended_vocab: true
  extended_vocab_path: "./tokenizer"
  sentinel_token: "<SMI_TOKEN>"
  use_cls_token: false # 确保此项与训练一致

  classifier_head:
    num_solvent_labels: 51
    loss_weight_multi_label: 1.0
    loss_weight_count: 1.0
    pooling_type: "mean"
    pos_weight_value: 1.0
  
  load_checkpoint: "./logs/solvent/full_multi_output/qwen2.5-1.5b/1.5B_solvent_bs24_lr1e-5_20251211_023042/final_solvent_model/full_model_manual.ckpt"

# ===== 推理核心配置 =====
inference:
  output_dir: "./logs/solvent/full_inference_results/qwen2.5-1.5b/bs24_lr1e-5_20251211_023042"
  max_samples: 999999
  threshold: 0.9
  max_count: 3

# ===== 数据配置（必须与溶剂训练一致）=====
data:
  test_data_path: "./data/solvent/test.txt"
  # !!! 关键路径：指定你的溶剂ID映射文件 (在数据预处理时生成)
  solvent_map_path: "./data/solvent/solvent_map.json"
  task_type: "solvent"
  max_length: 128
  rxn_max_length: 128

# ===== 并行配置（按需调整）=====
parallel:
  enabled: true
  parallel_mode: "DATA_PARALLEL"
  gradients_mean: true
  parameter_broadcast: true
  worker_num: 8
  local_worker_num: 8
  master_addr: "127.0.0.1"
  master_port: 8121     # 使用一个与训练(8119)不同的端口
  log_dir: "./logs/solvent/full_inference_logs/qwen2.5-1.5b"

# ===== 评估配置 =====
evaluation:
  save_detailed_results: true  # 保存每个样本的预测细节

# ===== 设备配置 =====
device:
  device_target: "Ascend"
  device_id: 0