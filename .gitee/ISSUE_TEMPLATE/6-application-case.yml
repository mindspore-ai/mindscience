name: 🤗 Support request for a new application case of science
description: Submit a proposal/request for a new application case of science
title: "[Application Case]: "
labels: ["application-case"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://gitee.com/mindspore/mindscience/issues).
- type: dropdown
  id: domain
  attributes:
   label: Which domain the issue belongs to?
   options:
    - MindSPONGE
    - MindFlow
    - MindEnergy
    - MindChemistry
    - MindEarth
    - Others
  validations:
   required: true

- type: textarea
  attributes:
    label: The model to consider.
    description: >
      A url, pointing to the model, e.g. https://huggingface.co/openai-community/gpt2 .
  validations:
    required: true
- type: textarea
  attributes:
    label: The closest model MindScience already supports.
    description: >
      Here is the list of models already supported by MindScience: https://gitee.com/mindspore/mindscience#%E6%A6%82%E8%BF%B0 . Which model is the most similar to the model you want to add support for?
- type: textarea
  attributes:
    label: What's your difficulty of supporting the model you want?
    description: >
      For example, any new operators or new architecture?
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!