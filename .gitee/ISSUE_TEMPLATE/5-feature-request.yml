name: 🚀 Feature request
description: Submit a proposal/request for a new MindScience feature
title: "[Feature]: "
labels: ["feature"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://gitee.com/mindspore/mindscience/issues).
- type: dropdown
  id: module
  attributes:
   label: Which module the issue belongs to?
   options:
    - MindScience data
    - MindScience common
    - MindScience e3nn
    - MindScience models
    - MindScience sciops
    - MindScience solver
    - MindScience sharker
    - MindScience utils
    - Others
  validations:
   required: true
- type: dropdown
  id: new_or_improvement
  attributes:
    label: Is this a new feature, an improvement, or a change to existing functionality?
    options:
      - New Feature
      - Improvement
      - Change
  validations:
    required: true

- type: textarea
  attributes:
    label: 🚀 The feature, motivation and pitch
    description: >
      A clear and concise description of the feature proposal. Please outline the motivation for the proposal. Is your feature request related to a specific problem? e.g., *"I'm working on X and would like Y to be possible"*. If this is related to another GitHub issue, please link here too. For feature design, you can refer to [feature design template](https://gitee.com/mindspore/mindscience/blob/br_refactor/docs/template/feature_design.md).
  validations:
    required: true
- type: textarea
  attributes:
    label: Alternatives
    description: >
      A description of any alternative solutions or features you've considered, if any.
- type: textarea
  attributes:
    label: Additional context
    description: >
      Add any other context or screenshots about the feature request.
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!