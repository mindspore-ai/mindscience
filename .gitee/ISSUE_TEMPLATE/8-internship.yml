name: 💻 Internship
description: This issue is intended for the MindScience open source internship project for college students
title: "[Internship]: "
labels: ["internship"]


body:
- type: markdown
  attributes:
    value: |
      - This issue is intended for the MindSpore open source internship project for college students. Developers who do not participate in this project are not allowed to receive it.
      - 本issue为面向高校学生的“MindSpore开源实习”项目的任务，非参加该项目的人员勿领。
- type: dropdown
  id: domain
  attributes:
   label: Which domain the issue belongs to?
   options:
    - MindSpore Science Core
    - applications-SPONGE
    - applications-Flow
    - applications-Energy
    - applications-Chemistry
    - applications-Earth
    - Others
  validations:
   required: true

