name: 💬 Request for comments (RFC).
description: Ask for feedback on major architectural changes or design choices.
title: "[RFC]: "
labels: ["RFC"]

body:
- type: textarea
  attributes:
    label: 背景与目标描述.
    description: >
      The motivation of the RFC.
  validations:
    required: true
- type: textarea
  attributes:
    label: 建议的方案.
    description: >
      The proposed change of the RFC.
  validations:
    required: true
- type: textarea
  attributes:
    label: 涉及到的对外API
    description: >
      描述该特性是否会有对外API的增加与变更情况的发生，以及变更可能会造成的周边影响.  
- type: textarea
  attributes:
    label: 测试验证
    description: >
      详细描述针对该方案，如何开展测试验证，以保证该特性的合入后对应的能力得到充分验证，包括到不限于功能、性能、可靠性、安全等.
  validations:
    required: true    
- type: textarea
  attributes:
    label: 期望的反馈时间.
    description: >
      The feedback period of the RFC. Usually at least one week.
  validations:
    required: false
- type: textarea
  attributes:
    label: CC List.
    description: >
      The list of people you want to CC.
  validations:
    required: false
- type: textarea
  attributes:
    label: 其他补充信息.
    description: >
      Any other things you would like to mention.
  validations:
    required: false
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉! The mindspore core team hosts a biweekly RFC review session, while most RFCs can be discussed online, you can optionally sign up for a slot to discuss your RFC online.
- type: checkboxes
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for previous [RFCs](https://gitcode.com/mindspore-lab/mindscience/issues?categorysearch=%255B%257B%22field%22:%22order_by_sort%22,%22value%22:%22created_at_desc%22,%22label%22:%22%E6%9C%80%E8%BF%91%E5%88%9B%E5%BB%BA%22%257D,%257B%22field%22:%22search%22,%22value%22:%22rfc%22,%22label%22:%22rfc%22%257D%255D&state=opened&order_by=created_at&sort=desc&scope=all&search=rfc&page=1).
        required: true