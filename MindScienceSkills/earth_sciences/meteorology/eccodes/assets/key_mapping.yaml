# Key Mapping for Common Meteorological Parameters
# Maps common parameter names to GRIB keys

# Temperature Parameters
temperature:
  shortName: t
  name: Temperature
  units: K

t2m:
  shortName: t2m
  name: "2 metre temperature"
  units: K

t850:
  shortName: t
  name: Temperature
  units: K
  level: 850
  typeOfLevel: isobaricInhPa

t500:
  shortName: t
  name: Temperature
  units: K
  level: 500
  typeOfLevel: isobaricInhPa

# Wind Parameters
u10:
  shortName: u10
  name: "10 metre U wind component"
  units: m s-1

v10:
  shortName: v10
  name: "10 metre V wind component"
  units: m s-1

u850:
  shortName: u
  name: "U component of wind"
  units: m s-1
  level: 850
  typeOfLevel: isobaricInhPa

v850:
  shortName: v
  name: "V component of wind"
  units: m s-1
  level: 850
  typeOfLevel: isobaricInhPa

# Pressure Parameters
sp:
  shortName: sp
  name: Surface pressure
  units: Pa

msl:
  shortName: msl
  name: Mean sea level pressure
  units: Pa

# Humidity Parameters
r:
  shortName: r
  name: Relative humidity
  units: "%"

q:
  shortName: q
  name: Specific humidity
  units: kg kg-1

# Precipitation Parameters
tp:
  shortName: tp
  name: Total precipitation
  units: kg m-2

cp:
  shortName: cp
  name: Convective precipitation
  units: kg m-2

lsp:
  shortName: lsp
  name: Large-scale precipitation
  units: kg m-2

