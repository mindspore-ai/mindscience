SOLVER= RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

MESH_FILENAME= mesh.su2

% --- Compressible freestream and flow conditions ---
MACH_NUMBER= 0.5
AOA= 2.0
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_PRESSURE= 101325.0

% --- Aerodynamic reference values for coefficient computation ---
% REF_AREA: reference area (use chord^2 for 2D airfoil, wing planform area for 3D)
% REF_LENGTH: reference length for moment coefficients (use chord for 2D)
% REF_ORIGIN_MOMENT: reference point for pitch moment (quarter-chord location is typical)
REF_AREA= 1.0
REF_LENGTH= 1.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0

% --- Boundary markers (compressible RANS) ---
% FARFIELD boundary: name matches mesh marker
MARKER_FAR= ( farfield )
% Heat-flux wall: MARKER_HEATFLUX, not MARKER_WALL
MARKER_HEATFLUX= ( wall, 0.0 )
% Monitoring surface for forces/moments
MARKER_MONITORING= ( wall )
MARKER_PLOTTING= ( wall )

% --- Turbulence (RANS requires a model) ---
TURB_MODEL= SST
CFL_NUMBER= 5.0

% --- Solver controls ---
MAX_ITER= 2000
CONV_FIELD= DRAG
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10
HISTORY_OUTPUT= RMS_RES, LIFT, DRAG, CAUCHY
