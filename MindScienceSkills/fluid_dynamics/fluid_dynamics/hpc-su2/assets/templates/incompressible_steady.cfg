% Steady incompressible viscous flow
% TIME_DOMAIN=NO is implicit (default) — do NOT add TIME_DOMAIN=YES
SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
FLUID_FORMAT= INCOMPRESSIBLE

MESH_FILENAME= mesh.su2

% Incompressible flow uses velocity components, not thermodynamic temperature
FREESTREAM_VELOCITY= ( 1.0, 0.0, 0.0 )

% Boundary markers — names must match mesh markers exactly
MARKER_INLET= ( inlet, 1.0, 0.0, 0.0 )   % (name, vel_x, vel_y, vel_z)
MARKER_OUTLET= ( outlet, 0.0 )            % (name, pressure)
MARKER_WALL= ( walls )

% Numerics
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 5.0
MAX_ITER= 1000

CONV_RESIDUAL_MIN_ITER= 100
HISTORY_OUTPUT= RMS_DENSITY, LIFT, DRAG
