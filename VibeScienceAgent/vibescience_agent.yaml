model_defaults:
  model_name: "your-model-id"
  provider: "openai"
  base_url: "https://your-api-endpoint.example/v1"
  api_key: "YOUR_API_KEY"
  temperature: 0.2
  max_tokens: 4096
  timeout: 60
  max_retries: 2
  max_connections: 8

# agent configurations; each agent can override model defaults and has its own settings
agents:
  plan:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 4096
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2
      use_tool_retriever: true
      skill_path: "" # Note: Windows recommends using absolute paths

  critic:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 4096
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2

  execute:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 4096
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2
      use_tool_retriever: true
      skill_path: "" # Note: Windows recommends using absolute paths

logging:
  level: "INFO"
