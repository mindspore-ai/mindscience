# ecCodes Configuration Template
# This file contains configuration options for ecCodes operations

[general]
# ecCodes installation directory
eccodes_path = /usr/local/lib/ecodes

# Define data directory
data_dir = /path/to/data

# Temporary directory for intermediate files
temp_dir = /tmp/ecodes

# Enable verbose output
verbose = false

# Enable debug output
debug = false

[grrib]
# GRIB edition preference (1 or 2)
preferred_edition = 2

# Default GRIB sample template
default_sample = GRIB2

# Enable multi-field GRIB support
multi_field_support = true

# Number of threads for parallel processing
num_threads = 4

# Memory limit for GRIB operations (in MB)
memory_limit = 1024

[grrib.packing]
# Default packing type
packing_type = grid_simple

# Binary scale factor
binary_scale_factor = 0

# Decimal scale factor
decimal_scale_factor = 0

# Bits per value
bits_per_value = 24

# Enable compression
enable_compression = true

# Compression type (jpeg2000, png, etc.)
compression_type = jpeg2000

[grrib.grid]
# Default grid type
default_grid_type = regular_ll

# Default number of longitude points
default_ni = 360

# Default number of latitude points
default_nj = 181

# Default latitude of first grid point
default_latitude_first = 90.0

# Default longitude of first grid point
default_longitude_first = 0.0

# Default latitude increment
default_latitude_increment = 1.0

# Default longitude increment
default_longitude_increment = 1.0

[bufr]
# BUFR edition preference (3 or 4)
preferred_edition = 4

# Default BUFR sample template
default_sample = BUFR4

# Master table version
master_table_version = 13

# Local table version
local_table_version = 0

# Enable data unpacking
auto_unpack = true

[indexing]
# Enable indexing
enable_indexing = true

# Index directory
index_dir = /tmp/ecodes/indexes

# Maximum number of cached indexes
max_cached_indexes = 32

# Index keys to use by default
default_index_keys = shortName,step,level

[validation]
# Enable validation
enable_validation = true

# Validate grid definitions
validate_grid = true

# Validate data values
validate_values = true

# Validate temporal information
validate_time = true

# Minimum value for temperature (K)
min_temperature = 150.0

# Maximum value for temperature (K)
max_temperature = 400.0

# Minimum value for pressure (Pa)
min_pressure = 10000.0

# Maximum value for pressure (Pa)
max_pressure = 150000.0

# Minimum value for wind speed (m/s)
min_wind_speed = 0.0

# Maximum value for wind speed (m/s)
max_wind_speed = 200.0

[output]
# Default output format (grib, netcdf, csv, json)
default_format = grib

# Precision for numeric output
precision = 6

# Enable pretty printing for JSON
pretty_print = true

# Output file encoding
encoding = utf-8

[logging]
# Enable logging
enable_logging = true

# Log file path
log_file = /tmp/ecodes/ecodes.log

# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

# Maximum log file size (in MB)
max_log_size = 10

# Number of backup log files
log_backup_count = 5

[performance]
# Enable caching
enable_caching = true

# Cache directory
cache_dir = /tmp/ecodes/cache

# Maximum cache size (in MB)
max_cache_size = 512

# Enable memory mapping
enable_mmap = true

# Buffer size for file I/O (in KB)
buffer_size = 64

# Enable parallel processing
enable_parallel = true

# Number of worker processes
num_workers = 4

# Batch size for processing
batch_size = 100

[spatial]
# Default spatial subset method (nearest, bilinear, conservative)
default_subset_method = bilinear

# Default regridding method
default_regrid_method = bilinear

# Earth radius for distance calculations (km)
earth_radius = 6371.0

# Enable spatial indexing
enable_spatial_index = true

[metadata]
# Preserve original metadata
preserve_metadata = true

# Add processing history
add_history = true

# History format
history_format = "Processed by ecCodes on %Y-%m-%d %H:%M:%S"

# Center identifier
centre = 255

# Sub-centre identifier
sub_centre = 0

# Generating process identifier
generating_process_identifier = 255

[error_handling]
# Error handling mode (strict, warn, ignore)
error_mode = strict

# Continue on error
continue_on_error = false

# Log errors
log_errors = true

# Raise exceptions on error
raise_exceptions = true

# Maximum number of errors before aborting
max_errors = 10