% Unsteady incompressible viscous flow with windowed convergence
% for statistically-periodic flows where time-averaged coefficients (e.g. TAVG_DRAG)
% must converge before the window threshold — do NOT mix with steady settings
SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
FLUID_FORMAT= INCOMPRESSIBLE

MESH_FILENAME= mesh.su2

% --- Time domain (required for unsteady) ---
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 0.01
TIME_ITER= 1000
INNER_ITER= 100

% --- Windowed convergence (for periodic/averaged coefficients) ---
WINDOW_CAUCHY_CRIT= YES
CONV_WINDOW_FIELD= ( TAVG_DRAG )
CONV_WINDOW_CAUCHY_ELEMS= 50
CONV_WINDOW_CAUCHY_EPS= 1E-3
WINDOW_START_ITER= 200
WINDOW_FUNCTION= HANN_SQUARE

% --- Inlet for incompressible: velocity components, NOT thermodynamic state ---
MARKER_INLET= ( inlet, 1.0, 0.0, 0.0 )   % (name, vel_x, vel_y, vel_z)
MARKER_OUTLET= ( outlet, 0.0 )

OUTPUT_FILES= ( RESTART, PARAVIEW )
