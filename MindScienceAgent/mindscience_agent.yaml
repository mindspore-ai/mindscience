# default model configurations for all agents; each agent can override these settings
model_defaults:
  model_name: null    # Your Model Name Here (e.g., "glm-5")
  provider: "openai"
  base_url: null      # Your API Base URL Here (e.g., "https://api.openai.com/v1")
  api_key: null       # Your API Key Here (e.g., "sk-...")
  temperature: 0.7
  max_tokens: 8192
  timeout: 60
  max_retries: 2
  max_connections: 8

# agent configurations; each agent can override model defaults and has its own settings
agents:
  plan:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 8192
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2
      use_tool_retriever: true
      skill_path: "" # Note: Windows recommends using absolute paths

  critic:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 8192
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2

  execute:
    model:
      # model settings
      model_name: null
      provider: null
      base_url: null
      api_key: null
      temperature: 0.7
      max_tokens: 8192
      timeout: 60
      max_retries: 2
      max_connections: 8
    agent:
      # general agent settings
      max_retries: 2
      use_tool_retriever: true
      skill_path: "" # Note: Windows recommends using absolute paths

logging:
  level: "INFO"
