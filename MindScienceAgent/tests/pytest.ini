[pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for individual components (fast, isolated, no external dependencies)
    integration: Integration tests for component interactions (slower, may require external services)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
